# Variant B - a job with one task per table. GENERATED by generate.py from
# ../pipeline/pipeline.yaml: do not edit, regenerate.
#
#   databricks bundle deploy -t dev
#   databricks bundle run pipetree_b_job_tasks -t dev

bundle:
  name: pipetree-part4-b-job-tasks
include:
- ../shared/variables.yml
sync:
  paths:
  - ../pipeline
  - ../shared
resources:
  jobs:
    pipetree_b_job_tasks:
      name: part 4 / B - a job with one task per table
      parameters:
      - name: faults
        default: ''
      - name: init
        default: 'false'
      job_clusters:
      - job_cluster_key: shared
        new_cluster: ${var.single_node_cluster}
      tasks:
      - task_key: bronze__customer
        job_cluster_key: shared
        max_retries: 2
        min_retry_interval_millis: 30000
        notebook_task:
          notebook_path: ../shared/run_pipeline.py
          base_parameters:
            catalog: ${var.catalog}
            config_path: ${workspace.file_path}/pipeline/pipeline.yaml
            select: bronze.customer
            max_workers: '1'
            faults: '{{job.parameters.faults}}'
            init: '{{job.parameters.init}}'
        libraries:
        - pypi:
            package: pipetree-meta[azure]==${var.pipetree_version}
      - task_key: bronze__employee
        job_cluster_key: shared
        max_retries: 2
        min_retry_interval_millis: 30000
        notebook_task:
          notebook_path: ../shared/run_pipeline.py
          base_parameters:
            catalog: ${var.catalog}
            config_path: ${workspace.file_path}/pipeline/pipeline.yaml
            select: bronze.employee
            max_workers: '1'
            faults: '{{job.parameters.faults}}'
            init: '{{job.parameters.init}}'
        libraries:
        - pypi:
            package: pipetree-meta[azure]==${var.pipetree_version}
      - task_key: bronze__orders
        job_cluster_key: shared
        max_retries: 2
        min_retry_interval_millis: 30000
        notebook_task:
          notebook_path: ../shared/run_pipeline.py
          base_parameters:
            catalog: ${var.catalog}
            config_path: ${workspace.file_path}/pipeline/pipeline.yaml
            select: bronze.orders
            max_workers: '1'
            faults: '{{job.parameters.faults}}'
            init: '{{job.parameters.init}}'
        libraries:
        - pypi:
            package: pipetree-meta[azure]==${var.pipetree_version}
      - task_key: silver__customer_enriched
        job_cluster_key: shared
        max_retries: 2
        min_retry_interval_millis: 30000
        notebook_task:
          notebook_path: ../shared/run_pipeline.py
          base_parameters:
            catalog: ${var.catalog}
            config_path: ${workspace.file_path}/pipeline/pipeline.yaml
            select: silver.customer_enriched
            max_workers: '1'
            faults: '{{job.parameters.faults}}'
            init: '{{job.parameters.init}}'
        libraries:
        - pypi:
            package: pipetree-meta[azure]==${var.pipetree_version}
        depends_on:
        - task_key: bronze__customer
      - task_key: gold__dim_customer
        job_cluster_key: shared
        max_retries: 2
        min_retry_interval_millis: 30000
        notebook_task:
          notebook_path: ../shared/run_pipeline.py
          base_parameters:
            catalog: ${var.catalog}
            config_path: ${workspace.file_path}/pipeline/pipeline.yaml
            select: gold.dim_customer
            max_workers: '1'
            faults: '{{job.parameters.faults}}'
            init: '{{job.parameters.init}}'
        libraries:
        - pypi:
            package: pipetree-meta[azure]==${var.pipetree_version}
        depends_on:
        - task_key: silver__customer_enriched
      - task_key: silver__orders
        job_cluster_key: shared
        max_retries: 2
        min_retry_interval_millis: 30000
        notebook_task:
          notebook_path: ../shared/run_pipeline.py
          base_parameters:
            catalog: ${var.catalog}
            config_path: ${workspace.file_path}/pipeline/pipeline.yaml
            select: silver.orders
            max_workers: '1'
            faults: '{{job.parameters.faults}}'
            init: '{{job.parameters.init}}'
        libraries:
        - pypi:
            package: pipetree-meta[azure]==${var.pipetree_version}
        depends_on:
        - task_key: bronze__orders
      - task_key: gold__fact_sales
        job_cluster_key: shared
        max_retries: 2
        min_retry_interval_millis: 30000
        notebook_task:
          notebook_path: ../shared/run_pipeline.py
          base_parameters:
            catalog: ${var.catalog}
            config_path: ${workspace.file_path}/pipeline/pipeline.yaml
            select: gold.fact_sales
            max_workers: '1'
            faults: '{{job.parameters.faults}}'
            init: '{{job.parameters.init}}'
        libraries:
        - pypi:
            package: pipetree-meta[azure]==${var.pipetree_version}
        depends_on:
        - task_key: gold__dim_customer
        - task_key: silver__orders
targets:
  dev:
    default: true
